<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Search - PRAgentS Shop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 PRAgentS Shop</h1>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products.html">Products</a>
                <a href="/user-search.html">Search Users</a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 2rem;">
        <h2>Search Users</h2>
        
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by name or email...">
            <button onclick="searchUsers()" class="btn btn-primary">Search</button>
        </div>

        <div id="search-results" style="margin-top: 2rem;"></div>

        <hr style="margin: 3rem 0;">

        <h2>Update Your Profile</h2>
        <form id="profile-form" style="max-width: 600px;">
            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="website">Website</label>
                <input type="text" id="website">
            </div>

            <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
    </div>

    <script>
        function searchUsers() {
            var searchTerm = document.getElementById('search-input').value;
            
            fetch('/api/user-search/search?q=' + searchTerm)
                .then(response => response.json())
                .then(data => {
                    var resultsDiv = document.getElementById('search-results');
                    resultsDiv.innerHTML = '';
                    
                    if (data.users && data.users.length > 0) {
                        data.users.forEach(user => {
                            var userDiv = document.createElement('div');
                            userDiv.innerHTML = '<h3>' + user.name + '</h3><p>' + user.email + '</p>';
                            resultsDiv.appendChild(userDiv);
                        });
                    } else {
                        resultsDiv.innerHTML = '<p>No users found for: ' + searchTerm + '</p>';
                    }
                });
        }

        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var bio = document.getElementById('bio').value;
            var website = document.getElementById('website').value;
            
            var userId = localStorage.getItem('userId');
            
            fetch('/api/user-search/profile/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: userId,
                    bio: bio,
                    website: website
                })
            })
            .then(response => response.json())
            .then(data => {
                alert('Profile updated!');
            });
        });

        function displayUserProfile(userId) {
            fetch('/api/user-search/profile/' + userId)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('search-results').innerHTML = html;
                });
        }

        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchUsers();
            }
        });

        var urlParams = new URLSearchParams(window.location.search);
        var message = urlParams.get('message');
        if (message) {
            var messageDiv = document.createElement('div');
            messageDiv.innerHTML = message;
            messageDiv.className = 'alert alert-info';
            document.querySelector('.container').prepend(messageDiv);
        }
    </script>
</body>
</html>

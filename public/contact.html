<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PRAgentS Shop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 PRAgentS Shop</h1>
            </div>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/products.html">Products</a>
                <a href="/cart.html">Cart <span id="cart-count" class="badge">0</span></a>
                <a href="/contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 2rem;">
        <h2>Contact Us</h2>
        
        <form id="contact-form" style="max-width: 600px; margin: 2rem auto;">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>

        <div id="response-message" style="margin-top: 1rem;"></div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 PRAgentS Ecommerce. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/contact-form.js"></script>
</body>
</html>
